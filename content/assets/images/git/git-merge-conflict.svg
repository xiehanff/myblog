<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrowC" viewBox="0 0 5 5" markerWidth="2.5" markerHeight="2.5" refX="4.2" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #1f2937; }
      .subtitle { font: 18px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #475569; }
      .label { font: 700 24px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #111827; }
      .text { font: 17px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #334155; }
      .mono { font: 16px Consolas, monospace; fill: #0f172a; }
      .line { stroke: #475569; stroke-width: 2.2; stroke-linecap: round; marker-end: url(#arrowC); }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="56" y="64" class="title">多人协作里为什么会产生冲突</text>
  <text x="56" y="100" class="subtitle">冲突的根因不是“都改了同一个文件”，而是 Git 无法唯一确定最终结果。</text>

  <text x="96" y="190" class="text">共同祖先</text>
  <circle cx="146" cy="250" r="30" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="134" y="258" class="mono">B</text>

  <text x="286" y="166" class="text">分支 A</text>
  <circle cx="376" cy="220" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="586" cy="220" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <text x="362" y="228" class="mono">A1</text>
  <text x="572" y="228" class="mono">A2</text>
  <path d="M174 240 L348 220" class="line"/>
  <path d="M404 220 L558 220" class="line"/>

  <text x="286" y="340" class="text">分支 C</text>
  <circle cx="376" cy="394" r="28" fill="#fecaca" stroke="#ef4444" stroke-width="3"/>
  <circle cx="586" cy="394" r="28" fill="#fecaca" stroke="#ef4444" stroke-width="3"/>
  <text x="362" y="402" class="mono">C1</text>
  <text x="572" y="402" class="mono">C2</text>
  <path d="M174 260 L348 394" class="line"/>
  <path d="M404 394 L558 394" class="line"/>

  <rect x="742" y="128" width="468" height="176" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="776" y="182" class="label">分支 A 的结果</text>
  <text x="776" y="232" class="mono">timeout = 5000</text>
  <text x="776" y="284" class="mono">errorText = "网络繁忙"</text>
  <path d="M614 220 L742 220" class="line"/>

  <rect x="742" y="360" width="468" height="176" rx="24" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="776" y="414" class="label">分支 C 的结果</text>
  <text x="776" y="464" class="mono">timeout = 10000</text>
  <text x="776" y="516" class="mono">errorText = "请求超时"</text>
  <path d="M614 394 L742 448" class="line"/>

  <rect x="286" y="532" width="470" height="132" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="320" y="582" class="label">merge / rebase 会停在这里</text>
  <text x="320" y="620" class="text">两边都改了同一段上下文，但结果不同。</text>
  <text x="320" y="650" class="text">Git 不能替你决定保留哪个值，所以需要人工处理。</text>
  <path d="M586 422 L520 532" class="line"/>
</svg>
