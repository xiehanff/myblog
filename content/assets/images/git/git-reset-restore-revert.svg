<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrowR" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #1f2937; }
      .subtitle { font: 18px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #475569; }
      .label { font: 700 24px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #111827; }
      .text { font: 17px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #334155; }
      .small { font: 16px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #334155; }
      .mono { font: 16px Consolas, monospace; fill: #0f172a; }
      .line { stroke: #475569; stroke-width: 2.2; stroke-linecap: round; marker-end: url(#arrowR); }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="56" y="64" class="title">恢复、重置、反做提交的区别</text>
  <text x="56" y="100" class="subtitle">都像“撤销”，但动的层完全不同。</text>

  <rect x="56" y="140" width="350" height="560" rx="26" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text x="88" y="188" class="label">恢复（restore）</text>
  <text x="88" y="232" class="text">作用层：工作区 / 暂存区</text>
  <text x="88" y="270" class="text">分支指针：不动</text>
  <text x="88" y="308" class="text">历史：不改写</text>
  <text x="88" y="360" class="text">适合：丢弃当前改动</text>
  <text x="88" y="394" class="text">或把已暂存内容撤回工作区</text>
  <rect x="98" y="470" width="120" height="50" rx="16" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <rect x="246" y="470" width="120" height="50" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="138" y="502" class="mono">工作区</text>
  <text x="286" y="502" class="mono">暂存区</text>
  <path d="M218 495 L246 495" class="line"/>
  <rect x="88" y="598" width="286" height="62" rx="18" fill="#eef2ff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="112" y="637" class="text">更像“恢复当前样子”，不是动历史。</text>

  <rect x="466" y="140" width="350" height="560" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="498" y="188" class="label">重置（reset）</text>
  <text x="498" y="232" class="text">作用层：当前本地分支</text>
  <text x="498" y="270" class="text">分支指针：会移动</text>
  <text x="498" y="308" class="text">工作区 / 暂存区：可一起重置</text>
  <text x="498" y="360" class="text">适合：撤回最近的本地提交</text>
  <text x="498" y="394" class="text">重新整理自己的提交边界</text>
  <rect x="520" y="444" width="150" height="44" rx="14" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="554" y="472" class="mono">目标提交</text>
  <rect x="698" y="444" width="90" height="44" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="726" y="472" class="mono">main</text>
  <circle cx="560" cy="548" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="660" cy="548" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="760" cy="548" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <text x="546" y="556" class="mono">C2</text>
  <text x="646" y="556" class="mono">C3</text>
  <text x="746" y="556" class="mono">C4</text>
  <path d="M588 548 L632 548" class="line"/>
  <path d="M688 548 L732 548" class="line"/>
  <path d="M740 488 L756 520" class="line"/>
  <path d="M602 488 L572 520" class="line"/>
  <text x="498" y="622" class="small">关键词：本地分支回退。</text>
  <text x="498" y="650" class="small">是否保留改动，取决于重置层级。</text>

  <rect x="876" y="140" width="350" height="560" rx="26" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="908" y="188" class="label">反做提交（revert）</text>
  <text x="908" y="232" class="text">作用层：当前历史末尾</text>
  <text x="908" y="270" class="text">分支指针：继续向前</text>
  <text x="908" y="308" class="text">历史：保留，只新增反向提交</text>
  <text x="908" y="360" class="text">适合：公共分支安全撤销</text>
  <text x="908" y="394" class="text">不想改写已共享历史</text>
  <rect x="1112" y="444" width="90" height="44" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1140" y="472" class="mono">main</text>
  <circle cx="960" cy="548" r="28" fill="#fecaca" stroke="#ef4444" stroke-width="3"/>
  <circle cx="1060" cy="548" r="28" fill="#fecaca" stroke="#ef4444" stroke-width="3"/>
  <circle cx="1160" cy="548" r="28" fill="#fecaca" stroke="#ef4444" stroke-width="3"/>
  <text x="946" y="556" class="mono">C2</text>
  <text x="1046" y="556" class="mono">C3</text>
  <text x="1146" y="556" class="mono">R4</text>
  <path d="M988 548 L1032 548" class="line"/>
  <path d="M1088 548 L1132 548" class="line"/>
  <path d="M1152 488 L1158 520" class="line"/>
  <text x="908" y="622" class="small">关键词：历史继续向前。</text>
  <text x="908" y="650" class="small">只是内容被反做一次。</text>
</svg>
