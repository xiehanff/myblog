<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="858" viewBox="0 0 1160 858" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="580" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">写入从应用缓冲经过文件系统到存储介质</text>
<rect x="75" y="100" width="1010" height="58" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580" y="135.0" text-anchor="middle" font-size="17" fill="#1e293b">应用缓冲（stdio / StringBuffer / 语言运行时）</text>
<path d="M580 160V177" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="182" width="1010" height="78" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="580" y="214.0" text-anchor="middle" font-size="17" fill="#1e293b">系统调用接口：read / write / fsync / fdatasync（陷入与切换细节见 01-操作系统概述</text>
<text x="580" y="239.0" text-anchor="middle" font-size="17" fill="#1e293b">）</text>
<path d="M580 262V279" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="284" width="1010" height="58" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580" y="319.0" text-anchor="middle" font-size="17" fill="#1e293b">VFS：按文件名找到 inode，决定走哪个文件系统</text>
<path d="M580 344V361" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="366" width="1010" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="580" y="401.0" text-anchor="middle" font-size="17" fill="#1e293b">文件系统：更新元数据、分配块、写日志（journal）</text>
<path d="M580 426V443" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="448" width="1010" height="58" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580" y="483.0" text-anchor="middle" font-size="17" fill="#1e293b">页缓存：数据先落在内存页，带脏标记（dirty）</text>
<path d="M580 508V525" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="530" width="1010" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="580" y="565.0" text-anchor="middle" font-size="17" fill="#1e293b">块层：bio → request，合并相邻请求，交给调度器排序</text>
<path d="M580 590V607" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="612" width="1010" height="58" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580" y="647.0" text-anchor="middle" font-size="17" fill="#1e293b">设备驱动：把请求翻译成设备能理解的命令</text>
<path d="M580 672V689" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="694" width="1010" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="580" y="729.0" text-anchor="middle" font-size="17" fill="#1e293b">设备控制器队列：设备自己决定何时执行</text>
<path d="M580 754V771" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="776" width="1010" height="58" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580" y="811.0" text-anchor="middle" font-size="17" fill="#1e293b">介质：磁盘盘片 / 闪存页 + 设备内部缓存与映射表</text>
</svg>
