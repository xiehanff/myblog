<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="560" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">fork、exec 与 wait 的父子进程时序</text><text x="285" y="102" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">父进程</text><text x="835" y="102" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">子进程</text><path d="M285 125V630M835 125V630" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/><rect x="100" y="145" width="370" height="68" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="285" y="186" text-anchor="middle" font-size="19" fill="#1e3a8a">调用 fork()</text><path d="M470 180H642" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><text x="555" y="164" text-anchor="middle" font-size="15" fill="#475569">创建子进程</text><rect x="650" y="235" width="370" height="68" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="835" y="276" text-anchor="middle" font-size="19" fill="#166534">fork 返回 0，继续执行</text><rect x="100" y="235" width="370" height="68" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="285" y="276" text-anchor="middle" font-size="19" fill="#1e3a8a">fork 返回子进程 PID</text><path d="M285 303V335" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="100" y="344" width="370" height="68" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="285" y="385" text-anchor="middle" font-size="19" fill="#1e3a8a">调用 wait() / waitpid()</text><path d="M835 303V335" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="650" y="344" width="370" height="68" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="835" y="385" text-anchor="middle" font-size="19" fill="#166534">execve("./app") 替换程序映像</text><path d="M835 412V444" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="650" y="453" width="370" height="68" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="835" y="494" text-anchor="middle" font-size="19" fill="#166534">新程序运行</text><path d="M835 521V553" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="650" y="562" width="370" height="68" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="835" y="603" text-anchor="middle" font-size="19" fill="#9f1239">exit(0) → 僵尸，等待回收</text><path d="M650 595H510V378H478" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="555" y="430" text-anchor="middle" font-size="15" fill="#475569">wait 取得退出状态</text><text x="285" y="663" text-anchor="middle" font-size="16" fill="#475569">回收子进程并释放内核资源</text></svg>