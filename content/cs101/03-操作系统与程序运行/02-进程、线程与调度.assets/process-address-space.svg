<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="560" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">一个可执行文件可启动多个独立进程</text><rect x="370" y="90" width="380" height="68" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="560" y="132" text-anchor="middle" font-size="19" fill="#9a3412">可执行文件 app（磁盘上的静态指令与数据）</text><path d="M560 158V192M560 192H300V226M560 192H820V226" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="80" y="236" width="440" height="280" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="300" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">进程 A（PID 4021）</text><text x="120" y="322" font-size="18" fill="#1e293b">独立地址空间：代码 / 数据 / 堆</text><text x="120" y="360" font-size="18" fill="#1e293b">独立文件描述符与凭据</text><text x="120" y="408" font-size="18" fill="#1e293b">线程 1：主线程</text><text x="120" y="446" font-size="18" fill="#1e293b">线程 2：网络</text><text x="120" y="484" font-size="18" fill="#1e293b">线程 3：计算</text><rect x="600" y="236" width="440" height="280" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="820" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">进程 B（PID 4022）</text><text x="640" y="322" font-size="18" fill="#1e293b">另一份独立地址空间</text><text x="640" y="360" font-size="18" fill="#1e293b">另一组文件描述符与资源</text><text x="640" y="408" font-size="18" fill="#1e293b">线程 1：主线程</text><text x="560" y="558" text-anchor="middle" font-size="17" fill="#475569">进程间资源相互隔离；每个进程内部可以包含多个线程</text></svg>