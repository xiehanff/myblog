<rect x="75" y="346" width="1010" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="580" y="381.0" text-anchor="middle" font-size="17" fill="#1e293b">系统调用接口：用户态请求内核服务的主要受控入口</text>
