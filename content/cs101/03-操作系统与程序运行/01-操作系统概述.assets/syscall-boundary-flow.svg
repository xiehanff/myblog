<rect x="75" y="428" width="1010" height="58" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580" y="463.0" text-anchor="middle" font-size="17" fill="#1e293b">│  内核在这里校验参数、检查权限、维护状态</text>
<path d="M580 488V505" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="510" width="1010" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="580" y="545.0" text-anchor="middle" font-size="17" fill="#1e293b">▼</text>
