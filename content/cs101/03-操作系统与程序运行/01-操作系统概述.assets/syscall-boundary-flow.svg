<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="920" viewBox="0 0 1160 920" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="580" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">read 调用经过库函数、系统调用与内核到达硬件</text>
<rect x="75" y="100" width="1010" height="58" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580" y="135.0" text-anchor="middle" font-size="17" fill="#1e293b">应用代码：read(fd, buffer, n)   // 只看到文件描述符与缓冲区</text>
<path d="M580 160V177" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
