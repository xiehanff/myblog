<text x="580" y="217.0" text-anchor="middle" font-size="17" fill="#1e293b">│  库函数（glibc、运行时、语言标准库）把参数搬进约定位置</text>
<path d="M580 242V259" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="75" y="264" width="1010" height="58" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="580" y="299.0" text-anchor="middle" font-size="17" fill="#1e293b">▼</text>
