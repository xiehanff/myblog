<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="540" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">终端输入、信号与命令执行</text><rect x="320" y="100" width="440" height="86" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="540" y="136" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">终端（tty / pts）</text><text x="540" y="165" text-anchor="middle" font-size="17" fill="#334155">行规程处理按键；INTR / QUIT / SUSP 产生信号</text><rect x="100" y="100" width="150" height="86" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="175" y="150" text-anchor="middle" font-size="19" fill="#1e293b">键盘</text><path d="M250 143H312" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><path d="M540 186V232" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="320" y="242" width="440" height="94" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="540" y="280" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">Shell（用户态进程）</text><text x="540" y="310" text-anchor="middle" font-size="17" fill="#334155">解析命令行、建立管道与重定向，再 fork + execve</text><path d="M540 336V378" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="320" y="388" width="440" height="70" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="540" y="431" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">外部程序进程（ls、grep、ss 等）</text><path d="M320 153H285V288H312" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="286" y="223" text-anchor="middle" font-size="15" fill="#475569">信号发给前台进程组</text></svg>