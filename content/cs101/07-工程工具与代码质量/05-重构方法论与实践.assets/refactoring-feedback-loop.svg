<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="550" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">小步重构的反馈循环</text><rect x="80" y="170" width="210" height="88" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="185" y="207" text-anchor="middle" font-size="18" fill="#1e293b">定位变化点</text><text x="185" y="234" text-anchor="middle" font-size="16" fill="#475569">选择一个边界</text><rect x="350" y="170" width="210" height="88" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="455" y="207" text-anchor="middle" font-size="18" fill="#1e293b">建立行为基线</text><text x="455" y="234" text-anchor="middle" font-size="16" fill="#475569">确认当前行为</text><rect x="620" y="170" width="210" height="88" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="725" y="207" text-anchor="middle" font-size="18" fill="#166534">做一个微小变换</text><text x="725" y="234" text-anchor="middle" font-size="16" fill="#166534">每次只改一件事</text><rect x="890" y="170" width="170" height="88" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="975" y="205" text-anchor="middle" font-size="17" fill="#9a3412">格式化 / 分析</text><text x="975" y="232" text-anchor="middle" font-size="17" fill="#9a3412">/ 测试</text><path d="M290 214H342M560 214H612M830 214H882" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><path d="M975 258V340H185V267" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="378" y="320" width="400" height="42" rx="18" fill="#fff"/><text x="578" y="348" text-anchor="middle" font-size="17" fill="#334155">仍然可工作，就再选下一步</text></svg>