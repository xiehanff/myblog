<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="服务端和客户端的 Socket 调用序列" viewBox="0 0 1300 310" width="1300" height="310">
<style>.node{fill:#fff;stroke:#8294aa;stroke-width:1.5}.edge{fill:none;stroke:#52657d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.lane{font:600 15px system-ui,"Microsoft YaHei",sans-serif;fill:#203149}.label{font:15px system-ui,"Microsoft YaHei",sans-serif;fill:#203149}.small{font:13px system-ui,"Microsoft YaHei",sans-serif;fill:#465a72}</style>
<defs><marker id="arrow" markerWidth="4.5" markerHeight="4.5" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#52657d"/></marker></defs>
<rect x="0.5" y="0.5" width="1299" height="309" rx="14" fill="#f6f8fb" stroke="#d5deea"/>
<text class="lane" x="22" y="93" text-anchor="start"><tspan x="22" y="93.0">服务端</tspan></text>
<text class="lane" x="22" y="225" text-anchor="start"><tspan x="22" y="225.0">客户端</tspan></text>
<rect class="node" x="160" y="58" width="150" height="60" rx="10"/><text class="label" x="235.0" y="93.0" text-anchor="middle"><tspan x="235.0" y="93.0">socket()</tspan></text>
<path class="edge" d="M 310 88.0 H 340" marker-end="url(#arrow)"/>
<rect class="node" x="350" y="58" width="150" height="60" rx="10"/><text class="label" x="425.0" y="93.0" text-anchor="middle"><tspan x="425.0" y="93.0">bind()</tspan></text>
<path class="edge" d="M 500 88.0 H 530" marker-end="url(#arrow)"/>
<rect class="node" x="540" y="58" width="150" height="60" rx="10"/><text class="label" x="615.0" y="93.0" text-anchor="middle"><tspan x="615.0" y="93.0">listen()</tspan></text>
<path class="edge" d="M 690 88.0 H 720" marker-end="url(#arrow)"/>
<rect class="node" x="730" y="58" width="150" height="60" rx="10"/><text class="label" x="805.0" y="93.0" text-anchor="middle"><tspan x="805.0" y="93.0">accept()</tspan></text>
<path class="edge" d="M 880 88.0 H 910" marker-end="url(#arrow)"/>
<rect class="node" x="920" y="58" width="150" height="60" rx="10"/><text class="label" x="995.0" y="93.0" text-anchor="middle"><tspan x="995.0" y="83.0">recv() /</tspan><tspan x="995.0" y="103.0">send()</tspan></text>
<path class="edge" d="M 1070 88.0 H 1100" marker-end="url(#arrow)"/>
<rect class="node" x="1110" y="58" width="150" height="60" rx="10"/><text class="label" x="1185.0" y="93.0" text-anchor="middle"><tspan x="1185.0" y="93.0">close()</tspan></text>
<rect class="node" x="160" y="190" width="150" height="60" rx="10"/><text class="label" x="235.0" y="225.0" text-anchor="middle"><tspan x="235.0" y="225.0">socket()</tspan></text>
<path class="edge" d="M 310 220.0 H 340" marker-end="url(#arrow)"/>
<rect class="node" x="350" y="190" width="150" height="60" rx="10"/><text class="label" x="425.0" y="225.0" text-anchor="middle"><tspan x="425.0" y="225.0">connect()</tspan></text>
<path class="edge" d="M 500 220.0 H 530" marker-end="url(#arrow)"/>
<rect class="node" x="540" y="190" width="150" height="60" rx="10"/><text class="label" x="615.0" y="225.0" text-anchor="middle"><tspan x="615.0" y="215.0">recv() /</tspan><tspan x="615.0" y="235.0">send()</tspan></text>
<path class="edge" d="M 690 220.0 H 720" marker-end="url(#arrow)"/>
<rect class="node" x="730" y="190" width="150" height="60" rx="10"/><text class="label" x="805.0" y="225.0" text-anchor="middle"><tspan x="805.0" y="225.0">close()</tspan></text>
