<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
</marker>
</defs>
<rect width="100%" height="100%" rx="28" fill="#ffffff" stroke="#334155" stroke-width="4"/>
<text x="800" y="66" font-size="38" font-weight="800" fill="#111827" text-anchor="middle">GestureArena 手势竞争与解析</text>
<text x="800" y="108" font-size="22" font-weight="600" fill="#64748b" text-anchor="middle">按原流程看：事件先进入竞技场，识别器竞争，最后再解析结果</text>

<rect x="520" y="142" width="560" height="52" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="175" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">PointerEvent 触摸开始</text>
<path d="M 800 194 L 800 228" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

<rect x="250" y="242" width="1100" height="180" rx="22" fill="#f2fbf1" stroke="#1d7a37" stroke-width="4"/>
<text x="800" y="292" font-size="30" font-weight="800" fill="#1d7a37" text-anchor="middle">GestureArena</text>
<text x="800" y="330" font-size="22" font-weight="700" fill="#166534" text-anchor="middle">所有感兴趣的 recognizer 都先加入这里</text>
<circle cx="336" cy="366" r="5" fill="#1d7a37"/>
<text x="356" y="374" font-size="22" font-weight="500" fill="#111827" text-anchor="start">Tap / Drag / Scale 同时进入竞争</text>
<circle cx="336" cy="402" r="5" fill="#1d7a37"/>
<text x="356" y="410" font-size="22" font-weight="500" fill="#111827" text-anchor="start">继续接收后续事件，等待 accept / reject / hold</text>

<path d="M 800 422 L 800 456" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="430" y="470" width="740" height="52" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="800" y="502" font-size="18" font-weight="650" fill="#334155" text-anchor="middle">accept / reject / hold / sweep</text>

<path d="M 800 522 L 800 570" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 800 595 L 890 705 L 800 815 L 710 705 Z" fill="#fff7ed" stroke="#d97706" stroke-width="4"/>
<text x="800" y="688" font-size="28" font-weight="800" fill="#b45309" text-anchor="middle">解析结果</text>
<text x="800" y="722" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">arena.resolve()</text>

<rect x="150" y="860" width="420" height="250" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
<text x="360" y="912" font-size="28" font-weight="800" fill="#111827" text-anchor="middle">唯一幸存（其余 reject）</text>
<text x="360" y="948" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">胜出识别器（默认判胜）</text>
<circle cx="196" cy="990" r="5" fill="#334155"/>
<text x="216" y="998" font-size="22" font-weight="500" fill="#111827" text-anchor="start">触发回调</text>
<circle cx="196" cy="1026" r="5" fill="#334155"/>
<text x="216" y="1034" font-size="22" font-weight="500" fill="#111827" text-anchor="start">onTap / onPan -> setState()</text>

<rect x="590" y="860" width="420" height="250" rx="22" fill="#fffdf6" stroke="#d97706" stroke-width="4"/>
<text x="800" y="912" font-size="28" font-weight="800" fill="#b45309" text-anchor="middle">多个仍未决</text>
<text x="800" y="948" font-size="22" font-weight="700" fill="#92400e" text-anchor="middle">继续竞争</text>
<circle cx="636" cy="990" r="5" fill="#d97706"/>
<text x="656" y="998" font-size="22" font-weight="500" fill="#111827" text-anchor="start">sweep / hold</text>
<circle cx="636" cy="1026" r="5" fill="#d97706"/>
<text x="656" y="1034" font-size="22" font-weight="500" fill="#111827" text-anchor="start">由 recognizer 实现策略决定</text>

<rect x="1030" y="860" width="420" height="250" rx="22" fill="#f7fbff" stroke="#2463c7" stroke-width="4"/>
<text x="1240" y="912" font-size="28" font-weight="800" fill="#111827" text-anchor="middle">全部 reject</text>
<text x="1240" y="948" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">没有手势胜出</text>
<circle cx="1076" cy="990" r="5" fill="#2463c7"/>
<text x="1096" y="998" font-size="22" font-weight="500" fill="#111827" text-anchor="start">不触发回调</text>
<circle cx="1076" cy="1026" r="5" fill="#2463c7"/>
<text x="1096" y="1034" font-size="22" font-weight="500" fill="#111827" text-anchor="start">继续等待下一轮事件</text>

<path d="M 710 815 L 570 860" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 800 815 L 800 860" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 890 815 L 1030 860" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
